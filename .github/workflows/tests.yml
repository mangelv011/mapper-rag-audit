name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Linux only: the default torch wheel bundles CUDA (multi-GB); the CPU build is enough here.
      - if: runner.os == 'Linux'
        run: echo "PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cpu" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
